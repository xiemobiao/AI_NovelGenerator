# Kubernetes Secrets
# 敏感信息（需要base64编码）

# 注意：在实际部署前，需要将所有密码替换为base64编码的实际值
# 编码方法：echo -n 'your-password' | base64

apiVersion: v1
kind: Secret
metadata:
  name: novel-generator-secrets
  namespace: novel-generator
  labels:
    app: novel-generator
type: Opaque
data:
  # 数据库密码 (base64编码)
  DB_PASSWORD: Y2hhbmdlX3RoaXNfcGFzc3dvcmQ=  # change_this_password
  DB_REPLICATION_PASSWORD: cmVwbGljYXRpb25fcGFzc3dvcmQ=  # replication_password

  # JWT密钥
  SECRET_KEY: eW91ci1zZWNyZXQta2V5LWNoYW5nZS10aGlzLWluLXByb2R1Y3Rpb24=  # your-secret-key-change-this-in-production

  # Redis密码
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ=  # redis_password

  # RabbitMQ密码
  RABBITMQ_USER: YWRtaW4=  # admin
  RABBITMQ_PASSWORD: YWRtaW5fcGFzc3dvcmQ=  # admin_password
  RABBITMQ_ERLANG_COOKIE: c2VjcmV0X2Nvb2tpZQ==  # secret_cookie

  # Sentry DSN
  SENTRY_DSN: aHR0cHM6Ly95b3VyLXNlbnRyeS1kc25Ac2VudHJ5LmlvL3Byb2plY3QtaWQ=  # https://your-sentry-dsn@sentry.io/project-id

  # OpenAI API Key
  OPENAI_API_KEY: c2steW91ci1vcGVuYWktYXBpLWtleS1oZXJl  # sk-your-openai-api-key-here
