# Ingress Controller
# 提供HTTP路由和HTTPS终端

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novel-generator-ingress
  namespace: novel-generator
  labels:
    app: novel-generator
  annotations:
    # Nginx Ingress配置
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # CORS配置
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # 限流配置
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # 超时配置
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

    # 缓冲配置
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

    # CDN配置（如果使用CloudFlare等CDN）
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Cache-Control: public, max-age=3600";
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";

spec:
  tls:
    - hosts:
        - api.novel-generator.com
        - www.novel-generator.com
      secretName: novel-generator-tls

  rules:
    # API域名
    - host: api.novel-generator.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000

    # 前端域名
    - host: www.novel-generator.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
---
# Certificate (cert-manager)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: novel-generator-cert
  namespace: novel-generator
spec:
  secretName: novel-generator-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - api.novel-generator.com
    - www.novel-generator.com
