[pytest]
# pytest配置文件

# 测试路径
testpaths = tests

# Python文件模式
python_files = test_*.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 显示详细输出
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=75
    -p no:warnings

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    auth: 认证相关测试
    db: 数据库相关测试
    websocket: WebSocket相关测试
    api: API端点测试

# 最小Python版本
minversion = 6.0

# 日志
log_cli = true
log_cli_level = INFO
