# HAProxy配置 - PostgreSQL读库负载均衡
# 提供读库高可用和负载均衡

global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client 1m
    timeout server 1m
    timeout check 10s

# PostgreSQL读库负载均衡
frontend postgres_read_frontend
    bind *:5432
    default_backend postgres_read_backend

backend postgres_read_backend
    mode tcp
    balance roundrobin
    option pgsql-check user postgres

    # 从库服务器
    server replica-1 database-replica-1:5432 check inter 10s rise 2 fall 3
    server replica-2 database-replica-2:5432 check inter 10s rise 2 fall 3

# 统计页面
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats auth admin:admin_password
